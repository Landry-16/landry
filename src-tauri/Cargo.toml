[package]
name = "landry"
version = "0.1.0"
description = "Landry, compagnon du quotidien pour Ubuntu GNOME"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = "0.18"
nucleo = "0.5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4"] }
sha2 = "0.11.1"
sha1 = "0.11.0"
md-5 = "0.11.0"
regex = "1.13.1"
similar = "3.2.0"
url = "2.5.8"
percent-encoding = "2.3.2"
notify = "8.2.0"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
fend-core = "1.5.8"
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
notify-rust = "4.18.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ashpd = { version = "0.13.13", features = ["screenshot", "remote_desktop", "screencast"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
# Enabled by the Tauri CLI for release builds; pass it to `cargo build` to embed dist/ instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
