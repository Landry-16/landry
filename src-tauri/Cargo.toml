[package]
name = "landry"
version = "0.1.0"
description = "Landry, compagnon du quotidien pour Ubuntu GNOME"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
# Enabled by the Tauri CLI for release builds; pass it to `cargo build` to embed dist/ instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
